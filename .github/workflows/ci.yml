name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # path-parser-processor må eksistere i ~/.m2 før path-parser sin testCompile
      # (som bruker processoren via annotationProcessorPaths) kan kjøre. Pass 1
      # bygger og installerer begge moduler uten testCompile (-DskipTests skipper
      # både test-compile og test). Pass 2 kjører full verify mot installerte artefakter.
      - name: Bootstrap install (skip tests so processor blir tilgjengelig)
        run: mvn -B -ntp -DskipTests install

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
