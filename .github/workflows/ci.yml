name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # path-parser-processor må eksistere i ~/.m2 før path-parser sin testCompile
      # (som bruker processoren via annotationProcessorPaths) kan kjøre. Pass 1
      # hopper over testCompile-fasen helt (-Dmaven.test.skip skipper compile +
      # eksekvering; -DskipTests alene skipper KUN eksekvering og kjører testCompile,
      # som ville krevd processoren). Pass 2 kjører full verify mot installert
      # processor.
      - name: Bootstrap install (hopp over tester for å installere processoren)
        run: mvn -B -ntp -Dmaven.test.skip=true install

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'
          if-no-files-found: warn
