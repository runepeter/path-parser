name: native-image

on:
  push:
    branches: [master]
  pull_request:
    types: [labeled]

jobs:
  build-native:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'native-image-required')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21.0.5'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Build and install runtime + processor
        run: mvn -B -ntp -DskipTests install

      - name: Build native-image smoke
        working-directory: examples/native-image-smoke
        run: mvn -B -ntp -DskipTests package

      - name: Run native binary
        run: |
          OUT=$(./examples/native-image-smoke/target/order-parser)
          echo "$OUT"
          if [ "$OUT" != "OK: O-42 199.95" ]; then
            echo "Native binary did not match expected output."
            exit 1
          fi
